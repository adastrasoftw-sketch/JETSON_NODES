{% extends 'index.html' %}
{% block content %}

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
}

/* Layout */
.container {
  display: flex;
  min-width: 100vw;
  height: 90vh;
  background: #f0f0f0;
  position: relative;
  top: 2%;
  padding: 10px;
  box-sizing: border-box;
}

.camera-section {
  display: flex;
  min-width: 70%;
  gap: 5px;
}

.go-pro { width: 45%; }
.camera-feeds { width: 55%; display: flex; flex-direction: column; gap: 5px; }
.zed { height: 40%; }
.cameras { height: 60%; display: flex; gap: 5px; }
.cam1, .cam2 { width: 50%; }

.right-section {
  min-width: 30%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.control-box {
  position: relative;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
}

#trackingCanvas {
  position: absolute;
  inset: 0;
  z-index: 5;
}

.status-overlay {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(255,255,255,0.9);
  padding: 8px;
  font-family: monospace;
  font-size: 12px;
  border-radius: 4px;
  z-index: 10;
}

/* Camera feeds */
.camera-feed {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: black;
  border-radius: 8px;
  cursor: zoom-in;
}

/* ===== ZOOM MODAL ===== */
.camera-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  z-index: 9999;
}

.camera-zoom-container {
  width: 100%;
  height: 100%;
  overflow: hidden;
  cursor: grab;
}

.camera-zoom-container:active {
  cursor: grabbing;
}

.camera-zoom-container img {
  transform-origin: center center;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}
</style>

<div class="container">

  <!-- LEFT CAMERAS -->
  <div class="camera-section">
    <div class="go-pro">
      <img src="{{ url_for('video_feed4') }}" class="camera-feed" onclick="openCamera(this)">
    </div>

    <div class="camera-feeds">
      <div class="zed">
        <img src="{{ url_for('video_feed1') }}" class="camera-feed" onclick="openCamera(this)">
      </div>

      <div class="cameras">
        <div class="cam1">
          <img src="{{ url_for('video_feed3') }}" class="camera-feed" onclick="openCamera(this)">
        </div>
        <div class="cam2">
          <img src="{{ url_for('video_feed2') }}" class="camera-feed" onclick="openCamera(this)">
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-section">
    <div class="control-box">
      <img src="{{ url_for('video_feed5') }}" class="camera-feed" onclick="openCamera(this)">
      <canvas id="trackingCanvas"></canvas>

      <!--<div class="status-overlay">
        <div>X: <span id="xPos">0</span></div>
        <div>Y: <span id="yPos">0</span></div>
        <div>Heading: <span id="heading">0</span>°</div>
      </div>-->
    </div>
  </div>

</div>

<!-- ZOOM MODAL -->
<div id="cameraModal" class="camera-modal">
  <div id="zoomContainer" class="camera-zoom-container">
    <img id="modalImg">
  </div>
</div>

<script>
/* ===== CAMERA ZOOM & PAN ===== */
let scale = 1;
let translateX = 0;
let translateY = 0;
let isDragging = false;
let startX, startY;

function openCamera(img) {
  const modal = document.getElementById("cameraModal");
  const modalImg = document.getElementById("modalImg");

  modalImg.src = img.src;

  scale = 1;
  translateX = 0;
  translateY = 0;
  applyTransform();

  modal.style.display = "block";
}

function closeCamera() {
  document.getElementById("cameraModal").style.display = "none";
}

function applyTransform() {
  modalImg.style.transform =
    `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

const zoomContainer = document.getElementById("zoomContainer");
const modalImg = document.getElementById("modalImg");

/* Zoom */
zoomContainer.addEventListener("wheel", (e) => {
  e.preventDefault();
  const zoomStep = 0.1;
  scale += e.deltaY < 0 ? zoomStep : -zoomStep;
  scale = Math.min(Math.max(0.5, scale), 5);
  applyTransform();
});

/* Pan */
zoomContainer.addEventListener("mousedown", (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  applyTransform();
});

window.addEventListener("mouseup", () => {
  isDragging = false;
});

/* Close */
document.getElementById("cameraModal").addEventListener("click", (e) => {
  if (e.target.id === "cameraModal") closeCamera();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeCamera();
});

/* ===== YOUR EXISTING CANVAS LOGIC (UNCHANGED) ===== */
const controlBox = document.querySelector(".control-box");
const canvas = document.getElementById("trackingCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const r = controlBox.getBoundingClientRect();
  canvas.width = r.width;
  canvas.height = r.height;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);
</script>

{% endblock %}
